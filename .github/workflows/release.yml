name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check release source
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: sh build.sh
      - run: python3 scripts/package.py
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: python3 scripts/test_packages.py
      - name: Publish immutable version assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=""
          case "$RELEASE_TAG" in v0.*|*-*) args="--prerelease" ;; esac
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --title "MacDown $RELEASE_TAG" --notes-file docs/release-notes.md $args
