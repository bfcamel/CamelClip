name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -buildvcs=false
  YTDLP_VERSION: '2026.8.19'

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Formatting, dependencies and static analysis
        run: |
          test -z "$(gofmt -l cmd internal)"
          go mod verify
          go vet ./...
          git diff --check
      - name: Public content and GUI progress
        run: |
          python3 scripts/check_public_content.py
          node scripts/test_gui_progress.cjs

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install fixture dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install fixture dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install pinned extractor
        run: python3 -m pip install 'yt-dlp==${{ env.YTDLP_VERSION }}'
      - name: Verify required tools
        run: |
          ffmpeg -version
          ffprobe -version
          yt-dlp --version
      - name: Race and recovery suite
        run: go test -race -p 1 -count=1 -timeout=5m ./...
      - name: Build application entry points
        run: |
          mkdir -p dist/ci
          go build -o dist/ci/camelclip ./cmd/camelclip
          go build -o dist/ci/camelclip-gui ./cmd/camelclip-gui
          go build -o dist/ci/camelclip-setup ./cmd/camelclip-setup
      - name: GUI, playlists and workspace smoke tests
        run: |
          python3 scripts/test_gui.py dist/ci/camelclip-gui
          python3 scripts/test_playlists.py dist/ci/camelclip-gui
          python3 scripts/test_workspace.py dist/ci/camelclip

  installers:
    name: Installer packages
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build all platform packages
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          sh scripts/build_installers.sh
      - name: Verify archives and native macOS component maintenance
        run: |
          python3 scripts/test_installers.py
          for package in dist/installers/*/*.pkg; do
            python3 scripts/test_installer_choices.py "$package"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-validation
          path: dist/installers/
          if-no-files-found: error
          retention-days: 7

  linux-installers:
    name: Linux installer maintenance
    needs: installers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installer-validation
          path: dist/installers/
      - name: Verify native Linux component maintenance
        run: python3 scripts/test_installers.py

  required:
    name: Required
    if: always()
    needs: [quality, test, installers, linux-installers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Required validation did not pass: ' + ', '.join(failed))
          print('All required checks passed.')
          PY
